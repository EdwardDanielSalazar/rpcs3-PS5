name: RPCS3 PS5 integrated build attempt
on:
  push:
    branches: [feature/ps5-13.42-rpcs3]
    paths: ['.github/workflows/rpcs3-integrated-ps5.yml', 'tools/patch-rpcs3-rng.sh', 'tools/patch-rpcs3-xmb-diagnostics.sh', 'tools/patch-rpcs3-rsx-semaphore-diagnostics.sh', 'tools/build-rpcs3.sh']
  workflow_dispatch:
jobs:
  rpcs3-ps5:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container: archlinux:latest
    steps:
      - name: Install pinned host build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git ca-certificates clang llvm lld cmake meson ninja python python-pip python-mako python-ply python-yaml wget unzip curl tar nasm glslang spirv-llvm-translator libclc spirv-headers pkgconf rsync zlib
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch project-pinned source trees
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tools/fetch-deps.sh 2>&1 | tee fetch-deps.log
          bash tools/install-sdk.sh 2>&1 | tee install-sdk.log
          df -h .
      - name: Restore compiled toolchain libraries
        uses: actions/cache@v4
        with:
          path: |
            deps/llvm-ps5
            deps/ffmpeg-ps5
            deps/libiconv-ps5
            deps/PS5_Vulkan/.deps/native/radv-release
          key: ps5-libs-v1-${{ runner.os }}-${{ hashFiles('tools/build-llvm.sh', 'tools/build-ffmpeg.sh', 'tools/build-libiconv.sh', 'tools/fetch-deps.sh', 'tools/install-sdk.sh', '.github/workflows/radv-ps5-build.yml') }}
          restore-keys: |
            ps5-libs-v1-${{ runner.os }}-
      - name: Build compatible RADV chain without missing OpenGL release
        shell: bash
        run: |
          set -euo pipefail
          # Driver's own PS5_Vulkan scripts require revisions distinct from RPCS3's
          # original source pins. Use independent validated revisions, not a
          # silent modification to tools/fetch-deps.sh.
          for spec in \
            'PS5_PayloadSDK b83202be73e930050e00de0f1b4d9ec46c0391bf' \
            'PS5_Mesa 7b59ef27c1b09b9671bc4153c41940c3155c3af2'; do
            read -r name rev <<< "$spec"
            git -C "deps/$name" fetch --depth=1 "https://github.com/lavavex/$name.git" "$rev"
            git -C "deps/$name" checkout --detach FETCH_HEAD
          done
          export PS5_PAYLOAD_SDK_FORK="$GITHUB_WORKSPACE/deps/PS5_PayloadSDK"
          export PS5_MESA_FORK="$GITHUB_WORKSPACE/deps/PS5_Mesa"
          export BUILD_JOBS=2 NINJAFLAGS=-j2
          cd deps/PS5_Vulkan
          bash tools/setup-native-dependencies.sh 2>&1 | tee "$GITHUB_WORKSPACE/radv-deps.log"
          bash tools/build-radv.sh release 2>&1 | tee "$GITHUB_WORKSPACE/radv-build.log"
          make libc > "$GITHUB_WORKSPACE/libc.log" 2>&1
          make app > "$GITHUB_WORKSPACE/native-tool.log" 2>&1 || true
          test -x build/host/ps5-native-tool
          test -s runtime/libc.prx
          test -s .deps/native/radv-release/lib/libvulkan_radeon.ps5.a
      - name: Build LLVM and RPCS3 libraries
        shell: bash
        run: |
          set -euo pipefail
          export CMAKE_BUILD_PARALLEL_LEVEL=2 NINJAFLAGS=-j2 JOBS=2
          bash tools/build-llvm.sh 2>&1 | tee llvm.log
          bash tools/build-zlib.sh 2>&1 | tee zlib.log
          bash tools/build-libiconv.sh 2>&1 | tee libiconv.log
          bash tools/build-ffmpeg.sh 2>&1 | tee ffmpeg.log
          df -h .
      # Keep Ninja object files between runs. The restore prefix permits small
      # patch changes to rebuild only affected objects instead of all RPCS3.
      # A source/toolchain fingerprint invalidates cache for substantial changes.
      - name: Restore incremental RPCS3 objects
        uses: actions/cache@v4
        with:
          path: build/rpcs3-ps5
          key: ps5-rpcs3-ninja-v1-${{ runner.os }}-${{ hashFiles('tools/build-rpcs3.sh', 'cmake/ps5-rpcs3.cmake', 'tools/fetch-deps.sh', 'tools/install-sdk.sh') }}-${{ github.sha }}
          restore-keys: |
            ps5-rpcs3-ninja-v1-${{ runner.os }}-${{ hashFiles('tools/build-rpcs3.sh', 'cmake/ps5-rpcs3.cmake', 'tools/fetch-deps.sh', 'tools/install-sdk.sh') }}-
      - name: Configure and attempt RPCS3 PS5 executable
        shell: bash
        run: |
          set -euo pipefail
          export NINJAFLAGS=-j2 CMAKE_BUILD_PARALLEL_LEVEL=2
          bash tools/build-rpcs3.sh 2>&1 | tee rpcs3-build.log
          test -s dist/PPSA99300/eboot.bin
          echo 'RPCS3 PS5 eboot generated (hardware functionality not verified)'
      - name: Publish PS5 test title for hardware validation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rpcs3-ps5-PPSA99300-${{ github.run_number }}
          path: dist/PPSA99300/
          if-no-files-found: error
          retention-days: 7
      - name: Publish diagnostic logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpcs3-integrated-ps5-logs
          path: |
            fetch-deps.log
            install-sdk.log
            radv-deps.log
            radv-build.log
            libc.log
            native-tool.log
            llvm.log
            zlib.log
            libiconv.log
            ffmpeg.log
            rpcs3-build.log
          if-no-files-found: ignore
